name: Update Photos (bi-monthly)

on:
  schedule:
    # Bi-monthly photo update only — heavy (1600+ HCDN assets)
    # Keep votaciones daily job light to avoid IP blocking
    - cron: '0 7 1 */2 *'  # 07:00 UTC on day 1 every 2 months
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run photo scraper
        run: python scraper.py fotos
        timeout-minutes: 30

      - name: Commit photo updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*photos.json docs/fotos/
          git diff --cached --quiet || git commit -m "🖼️ Update legislator photos $(date -u +%Y-%m-%d)"
          git push
