name: Update Data & Deploy

on:
  schedule:
    # Run every day at 07:00 UTC (04:00 GMT-3)
    - cron: '0 7 * * *'
  workflow_dispatch:  # Allow manual runs

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py
        timeout-minutes: 120

      - name: Check for new data
        id: check_new
        run: |
          git add data/diputados.json data/senadores.json
          if git diff --cached --quiet; then
            echo "new_data=false" >> $GITHUB_OUTPUT
            echo "No new votaciones detected — skipping rebuild and deploy."
          else
            echo "new_data=true" >> $GITHUB_OUTPUT
            echo "New votaciones detected — will rebuild and deploy."
          fi

      - name: Generate AI names for new laws
        if: steps.check_new.outputs.new_data == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-4o-mini' }}
        run: python tools/generate_ai_names.py
        timeout-minutes: 30

      - name: Generate site data
        if: steps.check_new.outputs.new_data == 'true'
        run: python generate_site.py

      - name: Commit updated data
        if: steps.check_new.outputs.new_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/data/ docs/fotos/
          git diff --cached --quiet || git commit -m "🔄 Update voting data $(date -u +%Y-%m-%d)"
          git push
