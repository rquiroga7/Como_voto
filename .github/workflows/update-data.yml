name: Update Data & Deploy

on:
  schedule:
    # Daily votaciones only (no photos) — keep traffic minimal
    - cron: '0 7 * * *'
  workflow_dispatch:  # Allow manual runs
    inputs:
      target:
        description: 'Scrape target (diputados/senadores/fotos or all)'
        required: false
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Independent chamber scrapes: HCDN 403/captcha after 2026-07-30
      # must not block Senado. See runner.py:33 and hcdn.py:86.
      # Each does minimal traffic: slug_map checks only current year
      # (1 POST) + delta votaciones (tail scan max 80 probes).
      - name: Run scraper - Senadores
        run: python scraper.py senadores
        timeout-minutes: 30

      - name: Run scraper - Diputados
        run: python scraper.py diputados
        timeout-minutes: 30
        continue-on-error: true

      - name: Check for new data
        id: check_new
        run: |
          git add data/diputados.json data/senadores.json
          if git diff --cached --quiet; then
            echo "new_data=false" >> $GITHUB_OUTPUT
            echo "No new votaciones detected — skipping rebuild and deploy."
          else
            echo "new_data=true" >> $GITHUB_OUTPUT
            echo "New votaciones detected — will rebuild and deploy."
          fi

      - name: Generate AI names for new laws
        if: steps.check_new.outputs.new_data == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-4o-mini' }}
        run: python tools/generate_ai_names.py
        timeout-minutes: 30

      - name: Generate site data
        if: steps.check_new.outputs.new_data == 'true'
        run: python generate_site.py

      - name: Commit updated data
        if: steps.check_new.outputs.new_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/data/ docs/fotos/
          git diff --cached --quiet || git commit -m "🔄 Update voting data $(date -u +%Y-%m-%d)"
          git push
